# 프론트엔드 배포 워크플로우
# フロントエンドデプロイワークフロー
#
# 트리거: main 브랜치에 frontend/ 변경 푸시 시
# トリガー: mainブランチにfrontend/変更プッシュ時
#
# 파이프라인:
# 1. 테스트 (lint, type-check)
# 2. Docker 이미지 빌드
# 3. ECR에 이미지 푸시
# 4. EC2에 SSH로 배포
#
# パイプライン:
# 1. テスト（lint, type-check）
# 2. Dockerイメージビルド
# 3. ECRにイメージプッシュ
# 4. EC2にSSHでデプロイ

name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  # 수동 실행 허용
  # 手動実行許可
  workflow_dispatch:

# 동시 실행 방지 (배포 중복 방지)
# 同時実行防止（デプロイ重複防止）
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  # AWS 리전 설정
  # AWSリージョン設定
  AWS_REGION: ap-northeast-1
  # ECR 레포지토리 이름 (CDK에서 정의된 이름)
  # ECRリポジトリ名（CDKで定義された名前）
  ECR_REPOSITORY: portfolio-dev-frontend

jobs:
  # ============================================================
  # Job 1: 테스트 실행
  # Job 1: テスト実行
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

  # ============================================================
  # Job 2: Docker 빌드 및 ECR 푸시
  # Job 2: DockerビルドおよびECRプッシュ
  #
  # AWS 인증 흐름:
  # GitHub Secrets → AWS Credentials Action → ECR Login
  #
  # AWS認証フロー:
  # GitHub Secrets → AWS Credentials Action → ECR Login
  # ============================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # github.sha는 커밋 해시로 안전한 값
          # github.shaはコミットハッシュで安全な値
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Docker 이미지 빌드
          # Dockerイメージビルド
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                       -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
                       -f frontend/Dockerfile \
                       frontend/

          # ECR에 푸시
          # ECRにプッシュ
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # 출력값 설정
          # 出力値設定
          echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Job 3: EC2 배포
  # Job 3: EC2デプロイ
  #
  # SSH를 통한 배포:
  # 1. EC2에 접속
  # 2. ECR에서 최신 이미지 Pull
  # 3. 기존 컨테이너 중지 및 삭제
  # 4. 새 컨테이너 실행
  #
  # SSHを通じたデプロイ:
  # 1. EC2に接続
  # 2. ECRから最新イメージPull
  # 3. 既存コンテナ停止および削除
  # 4. 新コンテナ実行
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR login password
        id: ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region "$AWS_REGION")" >> "$GITHUB_OUTPUT"

      # RDS 및 Cognito 환경변수 조회
      # RDSおよびCognito環境変数取得
      - name: Get environment variables from AWS
        id: get-env-vars
        run: |
          # RDS Secret 조회
          # RDS Secret取得
          RDS_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name RdsStack \
            --query "Stacks[0].Outputs[?OutputKey=='RdsSecretArn'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$RDS_SECRET_ARN" ]; then
            RDS_SECRET=$(aws secretsmanager get-secret-value \
              --secret-id "$RDS_SECRET_ARN" \
              --query SecretString --output text)

            DB_HOST=$(echo "$RDS_SECRET" | jq -r '.host')
            DB_PORT=$(echo "$RDS_SECRET" | jq -r '.port')
            DB_NAME=$(echo "$RDS_SECRET" | jq -r '.dbname')
            DB_USER=$(echo "$RDS_SECRET" | jq -r '.username')
            DB_PASSWORD=$(echo "$RDS_SECRET" | jq -r '.password')

            echo "database-url=postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME" >> "$GITHUB_OUTPUT"
          fi

          # Cognito 정보 조회
          # Cognito情報取得
          COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name CognitoStack \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text 2>/dev/null || echo "")

          COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name CognitoStack \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text 2>/dev/null || echo "")

          echo "cognito-user-pool-id=$COGNITO_USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "cognito-client-id=$COGNITO_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          DATABASE_URL: ${{ steps.get-env-vars.outputs.database-url }}
          COGNITO_USER_POOL_ID: ${{ steps.get-env-vars.outputs.cognito-user-pool-id }}
          COGNITO_CLIENT_ID: ${{ steps.get-env-vars.outputs.cognito-client-id }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,IMAGE_URI,AWS_REGION,DATABASE_URL,COGNITO_USER_POOL_ID,COGNITO_CLIENT_ID
          script: |
            # ECR 로그인
            # ECRログイン
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$(echo "$IMAGE_URI" | cut -d'/' -f1)"

            # 최신 이미지 Pull
            # 最新イメージPull
            docker pull "$IMAGE_URI"

            # 기존 컨테이너 중지 및 삭제 (에러 무시)
            # 既存コンテナ停止および削除（エラー無視）
            docker stop nextjs-app || true
            docker rm nextjs-app || true

            # 새 컨테이너 실행 (환경변수 포함)
            # 新コンテナ実行（環境変数含む）
            docker run -d \
              --name nextjs-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e "DATABASE_URL=$DATABASE_URL" \
              -e "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID" \
              -e "NEXT_PUBLIC_COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" \
              -e "NEXT_PUBLIC_COGNITO_REGION=$AWS_REGION" \
              "$IMAGE_URI"

            # 헬스체크
            # ヘルスチェック
            sleep 10
            curl -f http://localhost:3000 || exit 1

            # 오래된 이미지 정리
            # 古いイメージ整理
            docker image prune -f
